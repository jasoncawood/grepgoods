server {
    listen 8080;
    resolver 8.8.8.8;

    location ~* ^/proxy/(https?):/(.*)$ {
        set $proto $1;
        set $path $2;
        set $upstream_url $proto://$path;

        # Only allow proxying to HTTPS
        if ($proto = "http") {
            return 403 "Insecure ingestion denied. HTTPS only.";
        }

        proxy_pass $upstream_url;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        # Strict MIME type validation
        header_filter_by_lua_block {
            local content_type = ngx.header.content_type
            local allowed_types = {
                ["image/jpeg"] = true,
                ["image/png"] = true,
                ["image/webp"] = true
            }

            if not content_type or not allowed_types[content_type] then
                ngx.status = 403
                ngx.header.content_type = "text/plain"
                ngx.header.content_length = nil
            end

            -- Drop SVG explicitly
            if content_type == "image/svg+xml" then
                ngx.status = 403
            end
        }

        # Security Headers
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self';";
    }
}
