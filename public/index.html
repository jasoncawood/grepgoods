<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrepGoods | Decentralized Market Index</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --muted: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border-bottom: 1px solid #334155;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: -0.025em;
            color: var(--accent);
        }

        .search-container {
            width: 90%;
            max-width: 600px;
            margin-bottom: 3rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid #334155;
            background: var(--card-bg);
            color: var(--text);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            width: 90%;
            max-width: 1200px;
            padding-bottom: 4rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .image-container {
            width: 100%;
            height: 200px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 1.5rem;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .item-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: #334155;
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .seller {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--muted);
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        .seller a {
            color: var(--accent);
            text-decoration: none;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <header>
        <h1>GrepGoods</h1>
        <p>Decentralized Marketplace Index</p>
    </header>

    <div class="search-container">
        <input type="text" id="search" placeholder="Search items, categories, or keywords...">
        
        <div class="filters">
            <select id="currency">
                <option value="">All Currencies</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
            </select>

            <div class="price-range">
                <input type="number" id="minPrice" placeholder="Min Price">
                <input type="number" id="maxPrice" placeholder="Max Price">
            </div>

            <input type="text" id="tagFilter" placeholder="Filter by #tag">
            
            <button id="clearFilters">Clear</button>
        </div>
    </div>

    <style>
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .filters select, .filters input {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
        }

        .price-range {
            display: flex;
            gap: 0.5rem;
        }

        .price-range input {
            width: 100px;
        }

        #clearFilters {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }
    </style>

    <div class="grid" id="listings">
        <!-- Listings will be injected here -->
    </div>

    <footer style="margin-top: auto; padding: 4rem 0; width: 100%; border-top: 1px solid #334155; text-align: center; color: var(--muted); font-size: 0.875rem;">
        <div style="margin-bottom: 1rem;">
            <a href="/privacy.html" style="color: var(--muted); margin: 0 1rem; text-decoration: none;">Privacy Policy</a>
            <a href="/terms.html" style="color: var(--muted); margin: 0 1rem; text-decoration: none;">Terms of Use</a>
            <a href="/conduct.html" style="color: var(--muted); margin: 0 1rem; text-decoration: none;">Federated Policy</a>
        </div>
        <p>&copy; 2026 GrepGoods. Built with privacy and decentralization in mind.</p>
    </footer>

    <script>
        const listingsContainer = document.getElementById('listings');
        const searchInput = document.getElementById('search');
        const currencySelect = document.getElementById('currency');
        const minPriceInput = document.getElementById('minPrice');
        const maxPriceInput = document.getElementById('maxPrice');
        const tagFilterInput = document.getElementById('tagFilter');
        const clearBtn = document.getElementById('clearFilters');

        let currentOffset = 0;
        const limit = 12;
        let isLoading = false;
        let hasMore = true;
        let currentQuery = '';

        async function fetchListings(append = false) {
            if (isLoading) return;
            isLoading = true;

            if (!append) {
                currentOffset = 0;
                hasMore = true;
                listingsContainer.innerHTML = '';
            }

            const q = searchInput.value;
            const currency = currencySelect.value;
            const minPrice = minPriceInput.value;
            const maxPrice = maxPriceInput.value;
            const tag = tagFilterInput.value.replace('#', '');

            const params = new URLSearchParams({
                q, currency, minPrice, maxPrice, tag,
                limit, offset: currentOffset
            });

            const response = await fetch(`/api/listings?${params.toString()}`);
            const listings = await response.json();

            if (listings.length < limit) {
                hasMore = false;
            }

            renderListings(listings, append);
            currentOffset += listings.length;
            isLoading = false;
        }

        function renderListings(listings, append = false) {
            if (!append && listings.length === 0) {
                listingsContainer.innerHTML = '<div class="empty-state">No listings found matching your criteria.</div>';
                return;
            }

            const html = listings.map(l => {
                const mediaUrl = l.media_urls.length > 0 
                    ? `http://localhost:8080/proxy/${l.media_urls[0]}` 
                    : null;

                const getHandle = (url) => {
                    try {
                        const parts = new URL(url);
                        const username = parts.pathname.split('/').pop();
                        return `@${username}@${parts.hostname}`;
                    } catch {
                        return 'Unknown Seller';
                    }
                };

                return `
                    <div class="card">
                        <div class="image-container">
                            ${mediaUrl ? `<img src="${mediaUrl}" alt="${l.item_name}">` : '<span>No Image</span>'}
                        </div>
                        <div class="card-content">
                            <div class="price">${l.price} ${l.currency}</div>
                            <div class="item-name">${l.item_name}</div>
                            <div class="tags">
                                ${l.tags.map(t => `<span class="tag" onclick="filterByTag('${t}')" style="cursor:pointer">${t}</span>`).join('')}
                            </div>
                            <div class="seller">
                                Sold by <a href="${l.activity_id}" target="_blank">${getHandle(l.actor_id)}</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (append) {
                listingsContainer.insertAdjacentHTML('beforeend', html);
            } else {
                listingsContainer.innerHTML = html;
            }
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                if (!isLoading && hasMore) {
                    fetchListings(true);
                }
            }
        });

        function filterByTag(tag) {
            tagFilterInput.value = tag;
            fetchListings();
        }

        let debounceTimeout;
        const debouncedFetch = () => {
            clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(() => fetchListings(), 300);
        };

        [searchInput, currencySelect, minPriceInput, maxPriceInput, tagFilterInput].forEach(el => {
            el.addEventListener('input', debouncedFetch);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            currencySelect.value = '';
            minPriceInput.value = '';
            maxPriceInput.value = '';
            tagFilterInput.value = '';
            fetchListings();
        });

        fetchListings();
    </script>
</body>
</html>
